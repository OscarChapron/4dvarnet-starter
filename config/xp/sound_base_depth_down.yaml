# @package _global_
ckpt: null

resolution: '1_20'

paths:
  inp:
    train: '/Odyssey/public/enatl60/celerity/eNATL60_BLB002_cutoff_freq_regrid_0_1000m.nc'
    test: '/Odyssey/public/natl60/celerity/NATL60GULF-CJM165_cutoff_freq_regrid_0_1000m.nc'

  inp_sst: 
    train: /Odyssey/public/enatl60/sst/eNATL60-BLB002-SST-2009-2010-1_20.nc
    test: /Odyssey/public/natl60/sst/NATL60-CJM165-SST-2009-2010-1_20.nc
      
  inp_ssh: 
    train: /Odyssey/public/enatl60/ssh/eNATL60-BLB002-ssh-2009-2010-${resolution}.nc
    test: /Odyssey/public/natl60/ssh/NATL60-CJM165-ssh-2012-2013-${resolution}.nc
    
  tgt:
    train: '/Odyssey/public/enatl60/celerity/eNATL60_BLB002_cutoff_freq_regrid_0_1000m.nc'
    test: '/Odyssey/public/natl60/celerity/NATL60GULF-CJM165_cutoff_freq_regrid_0_1000m.nc'
    
  tgt_sst:
    train: /Odyssey/public/enatl60/sst/eNATL60-BLB002-SST-2009-2010-1_20.nc
    test: /Odyssey/public/natl60/sst/NATL60-CJM165-SST-2009-2010-1_20.nc

  tgt_ssh:  
    train: /Odyssey/public/enatl60/ssh/eNATL60-BLB002-ssh-2009-2010-${resolution}.nc
    test:  /Odyssey/public/natl60/ssh/NATL60-CJM165-ssh-2012-2013-${resolution}.nc

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: false
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: 1
  logger:
    _target_: pytorch_lightning.loggers.tensorboard.TensorBoardLogger
    save_dir: ${hydra:runtime.output_dir}
    name: ${hydra:runtime.choices.xp}
    version: ''
  max_epochs: 150
  accumulate_grad_batches: 16
  callbacks:
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: val_mse
      save_top_k: 3
      filename: '{val_mse:.5f}-{epoch:03d}'

datamodule:
  xrds_kw:
    patch_dims: { time: 15, lat: 240, lon: 240 }
    strides:    { time: 1,  lat: 200, lon: 200 }
  dl_kw: { batch_size: 16, num_workers: 1 }
  aug_kw:
    aug_factor: 2

train_dm:
  _target_: contrib.transfert.TransfertDataModule
  input_da:
    _target_: contrib.transfert.load_natl_data
    tgt_path: ${paths.tgt.train}
    tgt_var: ecs
    inp_path: ${paths.inp.train}
    inp_var: ecs
    domain: ${domain.train}
  domains:
    train:
      time: { _target_: builtins.slice, _args_: ['2009-07-01', '2010-04-09'] }
    val:
      time: { _target_: builtins.slice, _args_: ['2010-04-10','2010-06-30'] }
    test: null
  xrds_kw:
    patch_dims: ${datamodule.xrds_kw.patch_dims}
    strides:    ${datamodule.xrds_kw.strides}
    domain_limits: ${domain.train}
  dl_kw: ${datamodule.dl_kw}
  aug_kw: ${datamodule.aug_kw}
  norm_type: 'z_score'

test_dm:
  _target_: contrib.transfert.TransfertDataModule
  input_da:
    _target_: contrib.transfert.load_natl_data
    tgt_path: ${paths.tgt.test}
    tgt_var: ecs
    inp_path: ${paths.inp.test}
    inp_var: ecs
    domain: ${domain.train}
  domains:
    train: null
    val: null
    test:
      time: { _target_: builtins.slice, _args_: ['2012-10-01', '2013-09-30'] }
  mean_std_domain: test
  xrds_kw:
    patch_dims: ${datamodule.xrds_kw.patch_dims}
    strides:    ${datamodule.xrds_kw.strides}
    domain_limits: ${domain.train}
  dl_kw: ${datamodule.dl_kw}
  aug_kw: ${datamodule.aug_kw}
  norm_type: 'z_score'
  std_c: 1.

model:
  # Switch to the latent-space Lightning module
  _target_: contrib.downsampling.Lit4dVarNetIgnoreNaNLatent
  persist_rw: false

  opt_fn:
    _target_: contrib.transfert.cosanneal_lr_adamw
    _partial_: true
    lr: 1e-3
    T_max: ${trainer.max_epochs}
    weight_decay: 1e-3

  # Triangular time weighting kept as-is
  rec_weight:
    _target_: src.utils.get_triang_time_wei
    patch_dims: ${datamodule.xrds_kw.patch_dims}
    crop: { time: 0, lat: 20, lon: 20 }
    offset: 1

  # # ===== Loss weights (latent-aware) =====
  # w_mse: 1.0
  # w_grad_mse: 0.1
  # w_mse_lr: 0.5
  # w_grad_mse_lr: 0.05
  # w_prior: 1e-3
  # w_latent_ae: 1e-3

  # ===== Latent solver =====
  solver:
    _target_: contrib.downsampling.GradSolverWithLatent
    n_step: 10
    lr_grad: 0.2
    # lbd: 1.0
    std_latent_init: 0.0

    # Prior/obs/grad modules as before
    prior_cost:
      _target_: contrib.transfert.BilinAEPriorCost_Fasc
      dim_in: 23 # ${datamodule.xrds_kw.patch_dims.time}
      dim_hidden: 32
      bilin_quad: false
      downsamp: 2
    obs_cost:
      _target_: contrib.transfert.BaseObsCost_Fasc
    grad_mod:
      _target_: src.models.ConvLstmGradModel
      dim_in: ${datamodule.xrds_kw.patch_dims.time}
      dim_hidden: 48

    # ===== Latent encoder/decoder =====
    latent_decoder:
      _target_: contrib.downsampling.LatentDecoderMR
      dim_state: ${datamodule.xrds_kw.patch_dims.time}
      dim_latent: 8            # residual channels at latent scale
      channel_dims: 64         # hidden width in decoder
      scale_factor: 4          # 240x240 → 60x60 latent grid
      interp_mode: 'bilinear'
      w_dx: 1.0

    latent_encoder:
      _target_: contrib.downsampling.LatentEncoderMR
      dim_state: ${datamodule.xrds_kw.patch_dims.time}
      dim_latent: 8
      channel_dims: 64
      scale_factor: 4

  sampling_rate: 0.001
  norm_type: 'z_score'
  test_metrics: ${metrics.test_metrics}
  pre_metric_fn:
    _target_: xarray.Dataset.sel
    _partial_: True
    time: { _target_: builtins.slice, _args_: ['2012-10-21', '2013-09-10'] }
    lat: ${domain.test.lat}
    lon: ${domain.test.lon}

metrics:
  nrmse_scores: { _target_: src.utils.rmse_based_scores_from_ds, _partial_: true }
  psd_scores:   { _target_: src.utils.psd_based_scores_from_ds,  _partial_: true }
  get0: { _target_: operator.itemgetter, _args_: [0] }
  get1: { _target_: operator.itemgetter, _args_: [1] }
  test_metrics:
    mu:
      _target_: src.utils.pipe
      _partial_: true
      fns: ['${metrics.nrmse_scores}', '${metrics.get0}']
    sig:
      _target_: src.utils.pipe
      _partial_: true
      fns: ['${metrics.nrmse_scores}', '${metrics.get1}']
    lx:
      _target_: src.utils.pipe
      _partial_: true
      fns: ['${metrics.psd_scores}', '${metrics.get0}']
    lt:
      _target_: src.utils.pipe
      _partial_: true
      fns: ['${metrics.psd_scores}', '${metrics.get1}']

entrypoints:
  - _target_: pytorch_lightning.seed_everything
    seed: 333
  - _target_: contrib.transfert.run  # fit + test
    trainer: ${trainer}
    lit_mod: ${model}
    train_dm: ${train_dm}
    test_dm: ${test_dm}
    ckpt: ${ckpt}

defaults:
  - /domain: gf
  - _self_
